[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "languette"
version = "0.0.22"
description = "A deterministic check against risky actions by coding agents: fail-closed PreToolUse guards for the commands that could ruin a day, such as recursive rm, git work loss, a disk wipe, a shutdown or a credential pasted into a command. The wheel also ships an installer that wires the guards into Claude Code and a doctor that says whether they are on."
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development",
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-CC-BY-SA"]
authors = [{ name = "Mark Brannan" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/mark-brannan/languette"

[project.scripts]
languette = "languette.__main__:main"

[tool.setuptools]
packages = ["languette", "languette.guards", "languette.rules"]

[tool.setuptools.package-data]
# Each guard's shipped rule file (docs/design/guard-rules.md), and the post the doctor
# times guard-private-terms' regular expressions over.
languette = ["rules/*.json", "rules/*.tsv", "rules/timing-sample.md"]

# `pytest --cov` reads this. `patch = subprocess` measures the hooks.json
# commands the hook scenarios run as child processes, not only in-process code.
[tool.coverage.run]
source = ["languette"]
branch = true
patch = ["subprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -n auto"
bdd_features_base_dir = "features"
markers = [
  "python: run the scenario against languette/ in-process",
  "hook: run the scenario against a hooks/hooks.json command, by subprocess",
  "shfmt_only: run the scenario against the shfmt rung only",
  "awk_only: run the scenario against the awk rung only",
  "no_shfmt: run the scenario on every engine but the shfmt rung, whose parse check denies it first",
  "table: the scenario's examples are the README's table",
  "family: a feature named for a family of guards; its scenarios run against every guard",
  "planned: a verdict no guard gives yet; expected to fail, never fails the run",
  "known_gap: a strict xfail, red the day the gap closes (features/smoke.feature)",
  "big: a big, complex command that runs on the shfmt rung every push (features/big.feature)",
  "full: runs only in the full sweep, `pytest --full` (nightly and on dispatch)",
]
