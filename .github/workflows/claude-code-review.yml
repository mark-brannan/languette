name: Claude PR Review

# Advisory reviewer, shared via mark-brannan/.github. Needs the
# CLAUDE_CODE_OAUTH_TOKEN repo secret; without it the review skips with a
# warning instead of failing.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    uses: mark-brannan/.github/.github/workflows/claude-review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    with:
      # Overriding replaces the default list, so restate it with claude[bot].
      allowed-bots: mergify[bot],mark-brannan-release-please[bot],claude[bot]
      prompt: |
        Review this pull request to a public repo of shell and awk hook guards
        for coding agents. A guard is a deterministic check that runs before an
        agent's action: it must fail closed, never execute its input, and never
        depend on a model. Flag correctness bugs, quoting and injection holes,
        and any credential in the diff. Skip pure style nits. Post inline
        comments on specific lines, then a short summary; say so briefly if
        you find nothing.

        For added or changed README, CHANGELOG, docs and SKILL.md prose, also
        fetch the writing rubric with `gh api
        repos/mark-brannan/claude/contents/rules/writing.md -H "Accept:
        application/vnd.github.raw"` and comment where an
        added line breaks a rule in it, citing the rule.
      allowed-tools: mcp__github_inline_comment__create_inline_comment,Bash(gh api repos/mark-brannan/claude/contents/rules/writing.md:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)
      timeout-minutes: 15
