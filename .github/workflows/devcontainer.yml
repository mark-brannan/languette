name: Devcontainer feature

# The feature's own test (devcontainer/test/languette): a container built with
# Claude Code and the feature, where `languette doctor` must find no ✗. It
# installs the released package and plugin, so it runs only when the feature
# changes. Not a gate. Measured locally: about 2 minutes, one job.

on:
  pull_request:
    paths:
      - "devcontainer/**"
      - ".github/workflows/devcontainer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: npx --yes @devcontainers/cli@0.89.0 features test -p devcontainer -f languette --skip-autogenerated
