name: CI

# Every gating job fans into `ci-gate`, so the ruleset requires one context:
# `ci-gate / gate`. Add a job here, then add it to the gate's `needs`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nonempty:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The squash title is the commit release-please reads, so it carries a
  # conventional type: `fix(doctor): ...`, not `doctor: ...`.
  pr-title:
    permissions:
      pull-requests: read
    uses: mark-brannan/.github/.github/workflows/pr-title.yml@main
    with:
      conventional: true

  # Every scenario in features/ under the Python engine on its awk rung,
  # features/big.feature's on its shfmt rung too (the rest of the shfmt rung
  # runs in full-sweep.yml), plus the hooks.json commands run as Claude Code
  # runs them. The same run checks the hooks.json shape (`claude plugin validate
  # --strict` passes a garbage one), the stdlib-only rule for languette/ and
  # the README table.
  # Python 3.11 is the floor (`requires-python`): 3.10 lacks re's possessive
  # repeats, which guard-private-terms reads. 3.12 sits between, 3.13 is the
  # newest the suite pins. One macOS leg, on 3.13, covers the other OS.
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # Measured per push: ubuntu 1m20s to 3m20s, macOS 4m20s.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 8 || 5 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # shfmt for the Python engine's shfmt rung: noble's is 3.8, past the 3.6 floor.
      # macOS gets the same 3.8.0 binary, checked by hash: shfmt's parse-error
      # columns differ between releases and features/ spells 3.8's.
      - name: Install shfmt
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ]; then
            curl -fsSL -o shfmt https://github.com/mvdan/sh/releases/download/v3.8.0/shfmt_v3.8.0_darwin_arm64
            echo "1481240d2a90d4f0b530688d76d4f9117d17a756b6027cfa42b96f0707317f83  shfmt" | shasum -a 256 -c -
            sudo install -m 755 shfmt /usr/local/bin/shfmt
            # guard-git-stacked-base wants a timeout; macOS ships none, Homebrew's coreutils has gtimeout
            # (the scenarios pass the runner's PATH on, so /opt/homebrew/bin is searched).
            brew install coreutils
          else
            sudo apt-get update -q
            sudo apt-get install -y -q shfmt
          fi
      - run: pip install -r requirements-dev.txt
      # smoke_steps.py builds its own PATHs and venvs: the smoke job runs it.
      # pytest-xdist on min(4, cores) workers: pyproject's -n auto, capped in tests/conftest.py.
      # --cov reads pyproject's [tool.coverage.run]; the report feeds the coverage job.
      # Absolute, so hook child processes (cwd elsewhere) write where the combine reads.
      - run: python -m pytest -q --cov --cov-report=xml
        env:
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
      # On main too: main's report at a PR's merge base is what the total's delta is measured against.
      # One leg uploads, so the artifact name never collides.
      - if: (github.event_name == 'pull_request' || github.event_name == 'push') && matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage.xml
          retention-days: 90

  # The parser ladder's promise end to end: require-well-formed's hooks.json
  # command under PATHs holding only shfmt, only bash, only python3, or a
  # venv's python3 with a pip parser. Red rows are strict xfails.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install shfmt
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q shfmt
      - run: pip install -r requirements-dev.txt
      - name: Smoke test under each parser
        run: |
          set -euo pipefail
          # Pinned: a row flips when its rung lands, never when upstream releases.
          v=$(mktemp -d)
          python -m venv "$v/bashlex" && "$v/bashlex/bin/pip" install -q bashlex==0.18
          python -m venv "$v/ts" && "$v/ts/bin/pip" install -q tree-sitter==0.26.0 tree-sitter-bash==0.25.1
          LANGUETTE_SMOKE_BASHLEX_PY=$v/bashlex/bin/python \
          LANGUETTE_SMOKE_TREESITTER_PY=$v/ts/bin/python \
            python -m pytest -q -rxX tests/smoke_steps.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -y -q shellcheck)
          shellcheck --severity=warning tests/stubs/*

  # Line, section and per-change word caps on the README, from
  # docs/budgets.json. Raising a cap is its own PR that says why.
  prose-budget:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main

  # A guard a pull request adds must take a name from the approved guard names
  # table under docs/, as the base has it. Guards already there are not checked.
  new-guard-names:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: New guards take an approved name
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "$BASE"
          python3 tests/new_guard_names.py "$BASE"

  # A measurement, not a gate, so it stays out of ci-gate's needs.
  complexity:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/complexity.yml@main

  # The copies a pull request adds, base to head. Also a measurement.
  duplication:
    permissions:
      contents: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/duplication.yml@main

  # Of the lines a pull request changes, the share the tests hit; the total's
  # move against main's report at the merge base. A measurement, not a gate.
  coverage:
    needs: tests
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: mark-brannan/.github/.github/workflows/coverage.yml@main

  ci-gate:
    needs: [nonempty, pr-title, tests, smoke, shellcheck, prose-budget, new-guard-names]
    if: always()
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
