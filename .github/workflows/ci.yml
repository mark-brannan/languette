name: CI

# Every gating job fans into `ci-gate`, so the ruleset requires one context:
# `ci-gate / gate`. Add a job here, then add it to the gate's `needs`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nonempty:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # Every scenario in features/, under each engine, under each awk. The awk
  # scanner is what the shell guards stand on, and awk is not one language:
  # one matrix leg per implementation, each picked by a symlink through
  # AWK_PATH (mawk, gawk and original-awk each Provide awk through
  # update-alternatives and do not Conflict, so all three install side by
  # side). fail-fast is off: the finding this exists for is "mawk is fine,
  # original-awk is not". The same run checks the hooks.json shape (`claude
  # plugin validate --strict` passes a garbage one), the stdlib-only rule for
  # languette/ and the README table.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        awk: [mawk, gawk, original-awk]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # shfmt for the Python engine's shfmt rung: noble's is 3.8, past the 3.6 floor.
      - name: Install mawk, gawk, original-awk, jq and shfmt
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q mawk gawk original-awk jq shfmt
      - run: pip install -r requirements-dev.txt
      - name: Scenarios under ${{ matrix.awk }}
        env:
          IMPL: ${{ matrix.awk }}
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          ln -s "$(command -v "$IMPL")" "$d/awk"
          AWK_PATH=$d python -m pytest -q
          # guard-private-terms's own bash suite, under the same awk.
          AWK_PATH=$d bash hooks/guard-private-terms.test.sh
          # no-foreign-worktree's own bash suite (~10 s, a fixture repo with worktrees), under the same awk.
          AWK_PATH=$d bash hooks/no-foreign-worktree.test.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -y -q shellcheck)
          shellcheck --severity=warning hooks/*.sh tests/stubs/*

  # Line, section and per-change word caps on the README, from
  # docs/budgets.json. Raising a cap is its own PR that says why.
  prose-budget:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main

  ci-gate:
    needs: [nonempty, tests, shellcheck, prose-budget]
    if: always()
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
