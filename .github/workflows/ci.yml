name: CI

# Every gating job fans into `ci-gate`, so the ruleset requires one context:
# `ci-gate / gate`. Add a job here, then add it to the gate's `needs`.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  nonempty:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/nonempty-diff.yml@main

  # The squash title is the commit release-please reads, so it carries a
  # conventional type: `fix(doctor): ...`, not `doctor: ...`.
  pr-title:
    permissions:
      pull-requests: read
    uses: mark-brannan/.github/.github/workflows/pr-title.yml@main
    with:
      conventional: true

  # Every scenario in features/, under the Python engine on its awk rung and
  # on its shfmt rung, plus the hooks.json commands run as Claude Code runs
  # them. The same run checks the hooks.json shape (`claude plugin validate
  # --strict` passes a garbage one), the stdlib-only rule for languette/ and
  # the README table.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # shfmt for the Python engine's shfmt rung: noble's is 3.8, past the 3.6 floor.
      # jq for the two bash suites' payloads.
      - name: Install shfmt and jq
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q shfmt jq
      - run: pip install -r requirements-dev.txt
      # smoke_steps.py builds its own PATHs and venvs: the smoke job runs it.
      - run: python -m pytest -q
      # The long tail of shell shapes for two guards, until features/ holds
      # them (~40 s: guard-worktrees builds a fixture repo with worktrees).
      - run: bash tests/guard-private-terms.test.sh
      - run: bash tests/guard-worktrees.test.sh

  # The parser ladder's promise end to end: require-well-formed's hooks.json
  # command under PATHs holding only shfmt, only bash, only python3, or a
  # venv's python3 with a pip parser. Red rows are strict xfails.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install shfmt
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q shfmt
      - run: pip install -r requirements-dev.txt
      - name: Smoke test under each parser
        run: |
          set -euo pipefail
          # Pinned: a row flips when its rung lands, never when upstream releases.
          v=$(mktemp -d)
          python -m venv "$v/bashlex" && "$v/bashlex/bin/pip" install -q bashlex==0.18
          python -m venv "$v/ts" && "$v/ts/bin/pip" install -q tree-sitter==0.26.0 tree-sitter-bash==0.25.1
          LANGUETTE_SMOKE_BASHLEX_PY=$v/bashlex/bin/python \
          LANGUETTE_SMOKE_TREESITTER_PY=$v/ts/bin/python \
            python -m pytest -q -rxX tests/smoke_steps.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: |
          set -euo pipefail
          command -v shellcheck || (sudo apt-get update -q && sudo apt-get install -y -q shellcheck)
          shellcheck --severity=warning tests/stubs/* tests/*.test.sh

  # Line, section and per-change word caps on the README, from
  # docs/budgets.json. Raising a cap is its own PR that says why.
  prose-budget:
    permissions:
      contents: read
    uses: mark-brannan/.github/.github/workflows/prose-budget.yml@main

  # A guard a pull request adds must take a name from the approved guard names
  # table under docs/, as the base has it. Guards already there are not checked.
  new-guard-names:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: New guards take an approved name
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch -q --depth=1 origin "$BASE"
          python3 tests/new_guard_names.py "$BASE"

  ci-gate:
    needs: [nonempty, pr-title, tests, smoke, shellcheck, prose-budget, new-guard-names]
    if: always()
    permissions: {}
    uses: mark-brannan/.github/.github/workflows/ci-gate.yml@main
    with:
      results: ${{ toJSON(needs) }}
