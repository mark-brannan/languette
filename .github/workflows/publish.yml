name: Publish

# Dispatched on a release tag, as the shared release workflow does
# (`gh workflow run publish.yml --ref vX.Y.Z`), this uploads to PyPI by
# trusted publishing (OIDC): no stored token. The `pypi` environment and this
# filename are what the PyPI publisher is registered against; renaming either
# breaks the upload.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      # PyPI resolves the README's relative links against pypi.org, so
      # point them at this commit on GitHub; the repo keeps them relative.
      - env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'EOF'
          import os, re, pathlib
          repo, sha = os.environ["REPO"], os.environ["SHA"]
          raw = f"https://raw.githubusercontent.com/{repo}/{sha}/"
          blob = f"https://github.com/{repo}/blob/{sha}/"
          def fix(m):
              return f"{m[1]}{m[2]}({(raw if m[1] else blob)}{m[3].removeprefix('./').lstrip('/')})"
          p = pathlib.Path("README.md")
          text = re.sub(r"(!?)(\[[^\]]*\])\((?!https?:|#|mailto:)([^)\s]+)\)", fix, p.read_text())
          # Fail closed on any link form the rewrite missed.
          if left := re.findall(r"\]\((?!https?:|#|mailto:)[^)]*\)|<(?:img|a)\s|^\s*\[[^\]]+\]:\s", text, re.M):
              raise SystemExit(f"relative links left in README.md: {left}")
          p.write_text(text)
          EOF
      - run: python -m build
      - run: twine check dist/*
      # PyPI versions cannot be reused, so a tag that disagrees with
      # pyproject.toml must not upload.
      - env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "ref $TAG is a $REF_TYPE, not a tag" >&2; exit 1; }
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "$TAG" ] || { echo "ref $TAG != pyproject version v$v" >&2; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The plugin directory follows the `release` branch: the tagged tree, with
  # the tag's version written into plugin.json. Main carries no version, so an
  # install from main updates on every commit; an install from `release`
  # updates only on a release, at the version PyPI has. If this job fails after
  # the upload, re-run only this job: a fresh dispatch stops at PyPI, which
  # refuses a version it already has. Recovery is "re-run failed jobs" on the
  # same run, not a new dispatch.
  plugin-release:
    needs: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: ${{ github.ref_name }}
        run: |
          jq --arg v "${TAG#v}" '{name} + {version: $v} + del(.name)' \
            .claude-plugin/plugin.json > plugin.json.new
          mv plugin.json.new .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          git commit -m "plugin: $TAG"
          git push --force origin HEAD:refs/heads/release
