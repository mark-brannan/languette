name: Publish

# Dispatched on a release tag, as the shared release workflow does
# (`gh workflow run publish.yml --ref vX.Y.Z`), this uploads to PyPI by
# trusted publishing (OIDC): no stored token. The `pypi` environment and this
# filename are what the PyPI publisher is registered against; renaming either
# breaks the upload.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # PyPI versions cannot be reused, so a tag that disagrees with
      # pyproject.toml must not upload.
      - env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          [ "$REF_TYPE" = tag ] || { echo "ref $TAG is a $REF_TYPE, not a tag" >&2; exit 1; }
          v=$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          [ "v$v" = "$TAG" ] || { echo "ref $TAG != pyproject version v$v" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
